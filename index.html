<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback, createContext, useContext } = React;

  appId: '1:969019204401:web:793271eb89215762ee8610',

const db = firebase.database();

// 👉 ĐỔI mật khẩu này trước khi public link cho người khác
const ADMIN_PASSCODE = 'khoi-admin-2026';
const MULTIPLIER = 2;
const RESET_INTERVAL_MS = 24 * 60 * 60 * 1000;

// ============ UTILS: tiền tệ K/M/B ============
function parseAmount(raw) {
  if (raw === null || raw === undefined) return 0;
  const str = String(raw).trim().toLowerCase().replace(/,/g, '');
  if (!str) return 0;
  const match = str.match(/^(\d+(?:\.\d+)?)\s*(k|m|b)?$/);
  if (!match) return NaN;
  const value = parseFloat(match[1]);
  const multiplier = { k: 1e3, m: 1e6, b: 1e9 }[match[2]] ?? 1;
  return Math.round(value * multiplier);
}
function formatAmount(num) {
  if (num == null || isNaN(num)) return '0';
  const n = Number(num), abs = Math.abs(n);
  const trim = (x) => Number(x.toFixed(2)).toString();
  if (abs >= 1e9) return trim(n / 1e9) + 'B';
  if (abs >= 1e6) return trim(n / 1e6) + 'M';
  if (abs >= 1e3) return trim(n / 1e3) + 'K';
  return n.toLocaleString('vi-VN');
}
function formatFull(num) {
  if (num == null || isNaN(num)) return '0';
  return Math.round(Number(num)).toLocaleString('vi-VN').replace(/,/g, '.');
}

// ============ SOUND FX (Web Audio API, tự tổng hợp, không cần file nhạc) ============
let _audioCtx = null;
function getAudioCtx() {
  if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (_audioCtx.state === 'suspended') _audioCtx.resume();
  return _audioCtx;
}
function playTone(ctx, freq, start, duration, type, peak) {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, ctx.currentTime + start);
  gain.gain.linearRampToValueAtTime(peak, ctx.currentTime + start + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + duration);
  osc.connect(gain).connect(ctx.destination);
  osc.start(ctx.currentTime + start);
  osc.stop(ctx.currentTime + start + duration + 0.05);
}
function playWinSound() {
  try {
    const ctx = getAudioCtx();
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => playTone(ctx, f, i * 0.09, 0.28, 'triangle', 0.16));
  } catch (e) {}
}
function playLoseSound() {
  try {
    const ctx = getAudioCtx();
    playTone(ctx, 220, 0, 0.35, 'sawtooth', 0.13);
    playTone(ctx, 155, 0.12, 0.45, 'sawtooth', 0.13);
  } catch (e) {}
}

// ============ VISUAL FX: confetti thắng / rung màn hình thua ============
function confettiBurst() {
  const canvas = document.createElement('canvas');
  Object.assign(canvas.style, { position: 'fixed', inset: 0, pointerEvents: 'none', zIndex: 9999 });
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  const colors = ['#3effa0', '#3ea7ff', '#ffcf3e'];
  const particles = Array.from({ length: 90 }, () => ({
    x: Math.random() * canvas.width,
    y: -20 - Math.random() * canvas.height * 0.4,
    r: 4 + Math.random() * 4,
    c: colors[Math.floor(Math.random() * colors.length)],
    vy: 2.5 + Math.random() * 3.5,
    vx: -1.5 + Math.random() * 3,
    rot: Math.random() * 360,
    vr: -8 + Math.random() * 16,
  }));
  let frame = 0;
  function tick() {
    frame++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach((p) => {
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate((p.rot * Math.PI) / 180);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 1.8);
      ctx.restore();
    });
    if (frame < 130) requestAnimationFrame(tick);
    else canvas.remove();
  }
  tick();
}
function flashScreen(color) {
  const div = document.createElement('div');
  Object.assign(div.style, {
    position: 'fixed', inset: 0, pointerEvents: 'none', zIndex: 9998,
    background: `radial-gradient(circle, ${color}33, transparent 70%)`,
    animation: 'flashFade .6s ease-out forwards',
  });
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 650);
}
function shakeScreen() {
  document.body.classList.add('screen-shake');
  setTimeout(() => document.body.classList.remove('screen-shake'), 420);
}
function triggerResultFx(status) {
  if (status === 'win') { playWinSound(); confettiBurst(); flashScreen('#3effa0'); }
  else if (status === 'lose') { playLoseSound(); shakeScreen(); flashScreen('#ff3e5e'); }
  else if (status === 'rejected') { playLoseSound(); shakeScreen(); flashScreen('#ff3e5e'); }
}

// ============ HOOK: lắng nghe 1 collection realtime ============
function useCollection(path) {
  const [items, setItems] = useState([]);
  useEffect(() => {
    const r = db.ref(path);
    const cb = (snap) => {
      const val = snap.val() || {};
      setItems(Object.entries(val).map(([id, data]) => ({ id, ...data })));
    };
    r.on('value', cb);
    return () => r.off('value', cb);
  }, [path]);
  return { items };
}

// ============ AUTH CONTEXT ============
const AuthContext = createContext(null);

function getLocalUid() {
  let uid = localStorage.getItem('txd_uid');
  if (!uid) {
    uid = crypto.randomUUID();
    localStorage.setItem('txd_uid', uid);
  }
  return uid;
}

function AuthProvider({ children }) {
  const [uid] = useState(getLocalUid);
  const [userDoc, setUserDoc] = useState(undefined);
  const [isAdmin, setIsAdmin] = useState(() => sessionStorage.getItem('txd_admin') === '1');

  useEffect(() => {
    const r = db.ref(`users/${uid}`);
    const cb = (snap) => setUserDoc(snap.exists() ? snap.val() : null);
    r.on('value', cb);
    return () => r.off('value', cb);
  }, [uid]);

  const registerName = useCallback(async (name) => {
    const trimmed = name.trim();
    if (!trimmed) throw new Error('Tên không được để trống');
    const snap = await db.ref('users').orderByChild('name').equalTo(trimmed).once('value');
    let dup = false;
    snap.forEach((child) => {
      if (child.key !== uid && child.val().status !== 'left') dup = true;
    });
    if (dup) throw new Error('Tên này đang có người sử dụng, vui lòng chọn tên khác.');

    // Mặc định vào web là Player luôn, không cần chờ duyệt.
    // Admin chỉ cần thao tác khi muốn nâng ai đó lên làm Host.
    await db.ref(`users/${uid}`).set({
      name: trimmed, role: 'player', status: 'approved',
      createdAt: firebase.database.ServerValue.TIMESTAMP,
      lastSeen: firebase.database.ServerValue.TIMESTAMP,
    });
    db.ref(`users/${uid}/status`).onDisconnect().set('left');
  }, [uid]);

  const loginAdmin = useCallback((pass) => {
    if (pass === ADMIN_PASSCODE) {
      sessionStorage.setItem('txd_admin', '1');
      setIsAdmin(true);
      return true;
    }
    return false;
  }, []);

  const logoutAdmin = useCallback(() => {
    sessionStorage.removeItem('txd_admin');
    setIsAdmin(false);
  }, []);

  const leaveSession = useCallback(async () => {
    await db.ref(`users/${uid}/status`).set('left');
    localStorage.removeItem('txd_uid');
    window.location.reload();
  }, [uid]);

  return (
    <AuthContext.Provider value={{ uid, userDoc, isAdmin, registerName, loginAdmin, logoutAdmin, leaveSession }}>
      {children}
    </AuthContext.Provider>
  );
}
function useAuth() { return useContext(AuthContext); }

// ============ COMPONENT: NameGate ============
function NameGate() {
  const { registerName } = useAuth();
  const [name, setName] = useState('');
  const [err, setErr] = useState('');
  const [loading, setLoading] = useState(false);

  async function handleSubmit(e) {
    e.preventDefault();
    setErr(''); setLoading(true);
    try { await registerName(name); }
    catch (e) { setErr(e.message); }
    finally { setLoading(false); }
  }

  return (
    <div className="card fade-in">
      <div className="eyebrow">// Truy Cập Hệ Thống</div>
      <h1 className="title">Nhập tên trong game</h1>
      <p className="subtitle">Nhập IGN Minecraft — bạn sẽ vào ngay với vai trò Người chơi. Admin có thể chỉ định bạn làm Nhà cái nếu cần.</p>
      <form onSubmit={handleSubmit}>
        <div className="field">
          <label>IGN Minecraft</label>
          <input className="tx-input" placeholder="VD: Khoi_Dev" value={name}
            onChange={(e) => setName(e.target.value)} maxLength={24} autoFocus />
        </div>
        {err && <div className="error-text">⚠ {err}</div>}
        <button className="btn btn-primary" disabled={loading || !name.trim()}>
          {loading ? 'Đang gửi...' : 'Vào hàng chờ duyệt'}
        </button>
      </form>
    </div>
  );
}

// ============ COMPONENT: PlayerUI ============
function PlayerUI() {
  const { uid, userDoc } = useAuth();
  const { items: allUsers } = useCollection('users');
  const { items: allQueue } = useCollection('queue');

  const hosts = useMemo(() => allUsers.filter((u) => u.role === 'host' && u.status === 'approved'), [allUsers]);
  const activeBet = useMemo(() => {
    const mine = allQueue.filter((q) => q.playerId === uid && !q.acknowledged);
    mine.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    return mine[0] || null;
  }, [allQueue, uid]);

  const [amountInput, setAmountInput] = useState('');
  const [selectedHostId, setSelectedHostId] = useState('');
  const [err, setErr] = useState('');
  const [copied, setCopied] = useState(false);

  // Nổ confetti / rung màn hình / phát âm thanh đúng 1 lần khi có kết quả mới
  useEffect(() => {
    if (activeBet && ['win', 'lose', 'rejected'].includes(activeBet.status)) {
      triggerResultFx(activeBet.status);
    }
  }, [activeBet?.id, activeBet?.status]);

  const parsedAmount = parseAmount(amountInput);
  const validAmount = !isNaN(parsedAmount) && parsedAmount > 0;
  const effectiveHostId = selectedHostId || hosts[0]?.id || '';
  const effectiveHost = hosts.find((h) => h.id === effectiveHostId);
  const payCommand = effectiveHost && validAmount ? `/pay ${effectiveHost.name} ${formatFull(parsedAmount)}` : '';

  function copyCmd() {
    navigator.clipboard.writeText(payCommand);
    setCopied(true); setTimeout(() => setCopied(false), 1500);
  }

  async function handleConfirmBank() {
    if (!validAmount) return setErr('Số tiền không hợp lệ (VD: 200k, 1.5m, 2b)');
    if (!effectiveHost) return setErr('Chưa có Nhà cái nào đang hoạt động.');
    setErr('');
    const betRef = db.ref('queue').push();
    await betRef.set({
      playerId: uid, playerName: userDoc?.name || '???',
      hostId: effectiveHost.id, hostName: effectiveHost.name,
      amount: parsedAmount, status: 'waiting', acknowledged: false,
      createdAt: firebase.database.ServerValue.TIMESTAMP,
    });
  }

  async function handleAcknowledge() {
    if (!activeBet) return;
    await db.ref(`queue/${activeBet.id}/acknowledged`).set(true);
    setAmountInput('');
  }

  if (activeBet && activeBet.status === 'waiting') {
    return (
      <div className="card fade-in">
        <div className="eyebrow">// Đang Xử Lý</div>
        <h1 className="title">Giao dịch đang chờ</h1>
        <p className="subtitle">Cược <span className="amount-gold">{formatAmount(activeBet.amount)}</span> với nhà cái <b>{activeBet.hostName}</b></p>
        <div className="spinner-wrap">
          <div className="spinner" />
          <div className="wait-text">ĐANG CHỜ NHÀ CÁI KIỂM TRA...</div>
        </div>
      </div>
    );
  }

  if (activeBet && ['win', 'lose', 'rejected'].includes(activeBet.status)) {
    const isWin = activeBet.status === 'win';
    const isRejected = activeBet.status === 'rejected';
    return (
      <div className="card fade-in">
        <div className="result-pop">
          {isRejected ? (
            <>
              <div className="result-title-lose">BỊ TỪ CHỐI</div>
              <p className="result-note">Ván cược đã bị hủy — có thể do Nhà cái từ chối hoặc không còn hoạt động. Vui lòng đặt cược lại.</p>
            </>
          ) : isWin ? (
            <>
              <div className="result-title-win">🎉 THẮNG</div>
              <p className="result-note">
                Bạn thắng <span className="amount-gold">{formatAmount(activeBet.winAmount || activeBet.amount * 2)}</span><br />
                Vui lòng check giao dịch bank tiền trong game!
              </p>
            </>
          ) : (
            <>
              <div className="result-title-lose">THUA</div>
              <p className="result-note">Chúc bạn may mắn lần sau!</p>
            </>
          )}
          <button className="btn btn-primary" onClick={handleAcknowledge}>Cược Ván Mới</button>
        </div>
      </div>
    );
  }

  return (
    <>
    <div className="card fade-in">
      <div className="eyebrow">// Bàn Cược</div>
      <h1 className="title">Đặt cược Tài Xỉu</h1>
      <p className="subtitle">Nhập số tiền muốn cược (hỗ trợ K / M / B).</p>
      {hosts.length === 0 && <div className="error-text" style={{ marginBottom: 16 }}>⚠ Hiện chưa có Nhà cái nào online.</div>}
      {hosts.length > 1 && (
        <div className="field">
          <label>Chọn Nhà Cái</label>
          <select className="tx-input" value={effectiveHostId} onChange={(e) => setSelectedHostId(e.target.value)}>
            {hosts.map((h) => <option key={h.id} value={h.id}>{h.name}</option>)}
          </select>
        </div>
      )}
      <div className="field">
        <label>Số tiền cược</label>
        <input className="tx-input" placeholder="VD: 500k, 1.2m, 2b" value={amountInput}
          onChange={(e) => setAmountInput(e.target.value)} />
      </div>
      {validAmount && (
        <div className="field">
          <label>Số tiền quy đổi</label>
          <div className="amount-money" style={{ fontSize: 20 }}>{formatFull(parsedAmount)} $</div>
        </div>
      )}
      {payCommand && (
        <div className="cmd-box">
          <span>{payCommand}</span>
          <button className="cmd-copy" onClick={copyCmd}>{copied ? '✓ Đã chép' : 'COPY'}</button>
        </div>
      )}
      {err && <div className="error-text">⚠ {err}</div>}
      <button className="btn btn-gold" disabled={!validAmount || !effectiveHost} onClick={handleConfirmBank}>
        Đã Bank — Vào Hàng Chờ
      </button>
    </div>
    <PlayerHistory uid={uid} allQueue={allQueue} />
    </>
  );
}

// ============ COMPONENT: PlayerHistory (danh sách + biểu đồ lãi/lỗ) ============
function PlayerHistory({ uid, allQueue }) {
  const history = useMemo(() => {
    return allQueue
      .filter((q) => q.playerId === uid && ['win', 'lose', 'rejected'].includes(q.status))
      .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  }, [allQueue, uid]);

  if (history.length === 0) {
    return (
      <div className="card card-wide fade-in" style={{ marginTop: 20 }}>
        <div className="eyebrow">// Lịch Sử</div>
        <h1 className="title">Thắng / Thua của bạn</h1>
        <div className="empty-state">Chưa có ván nào hoàn tất — cược xong sẽ hiện ở đây.</div>
      </div>
    );
  }

  let cum = 0;
  const points = history.map((h) => {
    let net = 0;
    if (h.status === 'win') net = (h.winAmount || h.amount * 2) - h.amount;
    else if (h.status === 'lose') net = -h.amount;
    cum += net;
    return { ...h, net, cum };
  });

  const totalWin = points.filter((p) => p.status === 'win').length;
  const totalLose = points.filter((p) => p.status === 'lose').length;
  const totalRejected = points.filter((p) => p.status === 'rejected').length;
  const netTotal = points[points.length - 1]?.cum || 0;

  const w = 600, h = 140, pad = 10;
  const maxAbs = Math.max(1, ...points.map((p) => Math.abs(p.cum)));
  const stepX = points.length > 1 ? (w - pad * 2) / (points.length - 1) : 0;
  const scaleY = (h / 2 - pad) / maxAbs;
  const coords = points.map((p, i) => `${pad + i * stepX},${h / 2 - p.cum * scaleY}`);
  const pathD = 'M' + coords.join(' L');

  const statusLabel = { win: 'Thắng', lose: 'Thua', rejected: 'Từ chối' };

  return (
    <div className="card card-wide fade-in" style={{ marginTop: 20 }}>
      <div className="eyebrow">// Lịch Sử</div>
      <h1 className="title">Thắng / Thua của bạn</h1>

      <div className="stat-row">
        <div className="stat-box">
          <div className="stat-num" style={{ color: 'var(--luck-green)' }}>{totalWin}</div>
          <div className="stat-label">Thắng</div>
        </div>
        <div className="stat-box">
          <div className="stat-num" style={{ color: 'var(--luck-red)' }}>{totalLose}</div>
          <div className="stat-label">Thua</div>
        </div>
        <div className="stat-box">
          <div className="stat-num" style={{ color: 'var(--text-mid)' }}>{totalRejected}</div>
          <div className="stat-label">Từ chối</div>
        </div>
        <div className="stat-box">
          <div className="stat-num" style={{ color: netTotal >= 0 ? 'var(--money-blue)' : 'var(--luck-red)' }}>
            {netTotal >= 0 ? '+' : ''}{formatAmount(netTotal)}
          </div>
          <div className="stat-label">Lãi/Lỗ ròng</div>
        </div>
      </div>

      {points.length > 1 && (
        <div className="chart-wrap">
          <svg viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" width="100%" height="140">
            <line x1="0" y1={h / 2} x2={w} y2={h / 2} stroke="var(--panel-edge)" strokeWidth="1" />
            <path d={pathD} fill="none" stroke="var(--money-blue)" strokeWidth="2"
              style={{ filter: 'drop-shadow(0 0 4px rgba(62,167,255,.7))' }} />
            {points.map((p, i) => {
              const x = pad + i * stepX, y = h / 2 - p.cum * scaleY;
              const color = p.status === 'win' ? 'var(--luck-green)' : p.status === 'lose' ? 'var(--luck-red)' : 'var(--text-dim)';
              return <circle key={p.id} cx={x} cy={y} r="3" fill={color} />;
            })}
          </svg>
        </div>
      )}

      <div>
        {[...points].reverse().map((p) => (
          <div key={p.id} className="hist-item">
            <div>
              <div className="qi-name">{p.hostName}</div>
              <div className="qi-meta">{p.createdAt ? new Date(p.createdAt).toLocaleString('vi-VN') : ''}</div>
            </div>
            <div style={{ textAlign: 'right' }}>
              <span className={`pill pill-${p.status}`}>{statusLabel[p.status]}</span>
              <div className={p.net >= 0 ? 'amount-money' : 'amount-gold'} style={{ marginTop: 4, color: p.net >= 0 ? 'var(--luck-green)' : 'var(--luck-red)', textShadow: 'none' }}>
                {p.net >= 0 ? '+' : ''}{formatAmount(p.net)}
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ============ COMPONENT: HostDashboard ============
function HostDashboard() {
  const { uid } = useAuth();
  const { items: allQueue } = useCollection('queue');
  const [copiedId, setCopiedId] = useState(null);

  const myQueue = useMemo(() => {
    const mine = allQueue.filter((q) => q.hostId === uid && q.status === 'waiting');
    mine.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    return mine;
  }, [allQueue, uid]);

  async function resolve(bet, status) {
    await db.ref(`queue/${bet.id}/status`).set(status);
    if (status === 'win') await db.ref(`queue/${bet.id}/winAmount`).set(bet.amount * MULTIPLIER);
  }

  function copyCmd(bet) {
    navigator.clipboard.writeText(`/pay ${bet.playerName} ${formatFull(bet.amount * MULTIPLIER)}`);
    setCopiedId(bet.id); setTimeout(() => setCopiedId(null), 1500);
  }

  return (
    <div className="card card-wide fade-in">
      <div className="eyebrow">// Bàn Nhà Cái</div>
      <h1 className="title">Hàng đợi xử lý ({myQueue.length})</h1>
      <p className="subtitle">Xử lý theo thứ tự vào trước (FIFO).</p>
      {myQueue.length === 0 && <div className="empty-state">Hàng đợi trống — chưa có ai đặt cược.</div>}
      {myQueue.map((bet, idx) => (
        <div key={bet.id} className="queue-item fade-in">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
            <div>
              <div className="qi-name">#{idx + 1} — {bet.playerName}</div>
              <div className="qi-meta">Cược: <span className="amount-gold">{formatAmount(bet.amount)}</span></div>
            </div>
            <span className="pill pill-waiting">Chờ xử lý</span>
          </div>
          <div className="cmd-box" style={{ marginBottom: 10 }}>
            <span>Nếu thắng: /pay {bet.playerName} {formatFull(bet.amount * MULTIPLIER)}</span>
            <button className="cmd-copy" onClick={() => copyCmd(bet)}>{copiedId === bet.id ? '✓ Đã chép' : 'COPY'}</button>
          </div>
          <div className="btn-row">
            <button className="btn btn-ghost" onClick={() => resolve(bet, 'rejected')}>Từ chối</button>
            <button className="btn btn-lose" onClick={() => resolve(bet, 'lose')}>Thua</button>
            <button className="btn btn-win" onClick={() => resolve(bet, 'win')}>Thắng</button>
          </div>
        </div>
      ))}
    </div>
  );
}

// ============ COMPONENT: AdminLogin ============
function AdminLogin() {
  const { loginAdmin } = useAuth();
  const [pass, setPass] = useState('');
  const [err, setErr] = useState(false);

  function handleSubmit(e) {
    e.preventDefault();
    if (!loginAdmin(pass)) { setErr(true); setTimeout(() => setErr(false), 1200); }
  }

  return (
    <div className="card fade-in">
      <div className="eyebrow">// Khu Vực Hạn Chế</div>
      <h1 className="title">Admin Access</h1>
      <p className="subtitle">Nhập mật khẩu quản trị.</p>
      <form onSubmit={handleSubmit}>
        <div className="field">
          <label>Passcode</label>
          <input className="tx-input" type="password" value={pass} onChange={(e) => setPass(e.target.value)} autoFocus />
        </div>
        {err && <div className="error-text">⚠ Sai mật khẩu.</div>}
        <button className="btn btn-primary">Truy cập</button>
      </form>
    </div>
  );
}

// ============ COMPONENT: AdminDashboard ============
function AdminDashboard() {
  const { logoutAdmin } = useAuth();
  const { items: allUsers } = useCollection('users');
  const { items: allQueue } = useCollection('queue');
  const [confirmReset, setConfirmReset] = useState(false);

  const activeUsers = useMemo(
    () => allUsers.filter((u) => u.status !== 'left').sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)),
    [allUsers]
  );

  async function setRole(uid, role) {
    await db.ref(`users/${uid}/role`).set(role);
    await db.ref(`users/${uid}/status`).set('approved');
  }

  // Hủy các ván đang "waiting" gắn với 1 host — dùng khi host bị xóa/thu hồi quyền,
  // để tránh Player bị kẹt màn hình chờ mãi mãi vì Nhà cái không còn tồn tại.
  async function cancelHostBets(hostUid) {
    const snap = await db.ref('queue').orderByChild('hostId').equalTo(hostUid).once('value');
    const updates = {};
    snap.forEach((child) => {
      if (child.val().status === 'waiting') updates[`${child.key}/status`] = 'rejected';
    });
    if (Object.keys(updates).length) await db.ref('queue').update(updates);
  }

  async function revoke(uid) {
    await cancelHostBets(uid);
    await db.ref(`users/${uid}/role`).set('player');
    await db.ref(`users/${uid}/status`).set('approved');
  }
  async function kick(uid) {
    await cancelHostBets(uid);
    await db.ref(`users/${uid}`).remove();
  }
  async function forceReset() {
    await db.ref('users').remove();
    await db.ref('queue').remove();
    await db.ref('settings/lastReset').set(Date.now());
    setConfirmReset(false);
  }

  const roleLabel = { pending: 'Chờ duyệt', host: 'Nhà cái', player: 'Người chơi' };
  const activeBets = allQueue.filter((q) => q.status === 'waiting').length;

  return (
    <div className="card card-wide fade-in">
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <div className="eyebrow">// Admin Control</div>
        <button className="btn btn-ghost" style={{ width: 'auto', padding: '6px 14px', fontSize: 12 }} onClick={logoutAdmin}>Đăng xuất</button>
      </div>
      <h1 className="title">Danh sách người dùng online ({activeUsers.length})</h1>
      <p className="subtitle">Có {activeBets} ván đang chờ xử lý.</p>
      {activeUsers.length === 0 && <div className="empty-state">Chưa có ai truy cập.</div>}
      {activeUsers.map((u) => (
        <div key={u.id} className="user-row">
          <div>
            <div className="qi-name">{u.name}</div>
            <span className={`pill pill-${u.role === 'pending' ? 'pending' : u.role}`}>{roleLabel[u.role] || u.role}</span>
          </div>
          <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', justifyContent: 'flex-end' }}>
            <button className={`role-btn ${u.role === 'host' && u.status === 'approved' ? 'active-host' : ''}`} onClick={() => setRole(u.id, 'host')}>Chỉ định Nhà Cái</button>
            <button className={`role-btn ${u.role === 'player' && u.status === 'approved' ? 'active-player' : ''}`} onClick={() => setRole(u.id, 'player')}>Chỉ định Người Chơi</button>
            {u.status === 'approved' && <button className="role-btn" onClick={() => revoke(u.id)}>Thu hồi</button>}
            <button className="role-btn" style={{ color: 'var(--luck-red)' }} onClick={() => kick(u.id)}>Xóa</button>
          </div>
        </div>
      ))}
      <div className="danger-zone">
        <div className="eyebrow" style={{ color: 'var(--luck-red)' }}>// Vùng nguy hiểm</div>
        <p className="subtitle" style={{ marginBottom: 12 }}>Xóa sạch toàn bộ user và hàng đợi. Hệ thống cũng tự reset sau 24h.</p>
        {!confirmReset ? (
          <button className="btn btn-lose" style={{ width: 'auto' }} onClick={() => setConfirmReset(true)}>Force Reset Toàn Bộ</button>
        ) : (
          <div className="btn-row">
            <button className="btn btn-lose" onClick={forceReset}>⚠ Xác nhận xóa sạch</button>
            <button className="btn btn-ghost" onClick={() => setConfirmReset(false)}>Hủy</button>
          </div>
        )}
      </div>
    </div>
  );
}

// ============ APP ============
function useAutoReset() {
  useEffect(() => {
    (async () => {
      const snap = await db.ref('settings/lastReset').once('value');
      const last = snap.exists() ? snap.val() : 0;
      if (Date.now() - last > RESET_INTERVAL_MS) {
        await db.ref('users').remove();
        await db.ref('queue').remove();
        await db.ref('settings/lastReset').set(Date.now());
      }
    })();
  }, []);
}

function MainFlow({ userDoc }) {
  if (userDoc === undefined) return <div className="spinner-wrap"><div className="spinner" /></div>;
  if (!userDoc || userDoc.status === 'left') return <NameGate />;
  if (userDoc.status === 'pending') return <PendingApproval name={userDoc.name} />;
  if (userDoc.status === 'approved' && userDoc.role === 'host') return <HostDashboard />;
  if (userDoc.status === 'approved' && userDoc.role === 'player') return <PlayerUI />;
  return <PendingApproval name={userDoc.name} />;
}

function App() {
  useAutoReset();
  const { userDoc, isAdmin, leaveSession } = useAuth();
  const isAdminRoute = window.location.search.includes('admin');

  return (
    <div className="screen">
      <div className="topbar">
        <div className="brand">TÀI·XỈU <b>ESCROW</b> // SERVER QUEUE SYSTEM</div>
        {userDoc && !isAdminRoute && (
          <button className="btn btn-ghost" style={{ width: 'auto', padding: '6px 14px', fontSize: 12 }} onClick={leaveSession}>
            Thoát ({userDoc.name})
          </button>
        )}
      </div>
      {isAdminRoute ? (isAdmin ? <AdminDashboard /> : <AdminLogin />) : <MainFlow userDoc={userDoc} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <AuthProvider><App /></AuthProvider>
);
</script>
</body>
